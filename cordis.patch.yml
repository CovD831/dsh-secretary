- insert:
    - id: preset-secretary
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: secretary
        name: 秘书
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: !!js >-
                process.getBuiltinModule('node:fs').readFileSync(process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-secretary/package.json')), 'prompts/secretary.md'), 'utf8')
              complete: true
              includeRuntimeContext: false
    - id: dsh-secretary
      name: 'dsh-secretary'
